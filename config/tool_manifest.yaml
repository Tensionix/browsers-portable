            tooltip: "Downloads and unpacked installers normally disappear from the workspace folder as soon as the build is published, because they are large. Keep them when a build failed and the reason has to be found: the half-finished result is then still on disk and can be looked at."
            tooltip_ru: "Загрузки и распакованные установщики обычно исчезают из папки workspace сразу после публикации сборки - они большие. Оставьте их, если сборка не удалась и нужно понять причину: тогда недоделанный результат останется на диске, и его можно будет посмотреть."

      - <<: *browsers_library_update

  - id: certificates
    title: "Certificate"
    title_ru: "Сертификат"
    description: "Trust for Russian state sites."
    description_ru: "Доверие к российским госсайтам."
    tooltip: "Add to build saves certificate files and install/revoke commands without changing Windows trust. Install adds trust to the current Windows account. Checking and revoking trust remain separate commands."
    tooltip_ru: "«Добавить в сборку» сохраняет файлы сертификатов и команды установки/отзыва, не меняя доверие Windows. «Установить» добавляет доверие текущей учётной записи Windows. Проверка и отзыв доверия — отдельные команды."
    children:
      - id: certificates_state
        title: "Check"
        title_ru: "Проверить"
        description: "Are the certificates in place."
        description_ru: "Стоят ли сертификаты."
        tooltip: "Looks for exactly the two certificates by their fingerprint and reports whether your account already trusts them. It reads the certificate stores and changes nothing, so it is safe to run at any time - including right after an install, to confirm that it worked."
        tooltip_ru: "Ищет ровно два сертификата по отпечатку и показывает, доверяет ли им уже ваша учётная запись. Только читает хранилища и ничего не меняет, поэтому запускать можно в любой момент - в том числе сразу после установки, чтобы убедиться, что она прошла."
        service: "system_core.services.browsers_portable_service:certificates_state"
        kind: "safe"

      - <<: *certificates_stage

      - id: certificates_install
        title: "Install"
        title_ru: "Установить"
        description: "Open state sites without a warning."
        description_ru: "Открывать госсайты без предупреждения."
        tooltip: "Adds both certificates to your account in Windows. This is not per browser and not per build: afterwards every Chromium browser on this account trusts them, an installed Chrome included. No administrator rights are needed, other accounts are untouched, and the revoke command below undoes it."
        tooltip_ru: "Добавляет оба сертификата вашей учётной записи в Windows. Это не для отдельного браузера и не для отдельной сборки: после этого им доверяют все браузеры на Chromium в этой учётной записи, включая установленный Chrome. Права администратора не нужны, другие учётные записи не затрагиваются, а команда отзыва ниже всё возвращает."
        service: "system_core.services.browsers_portable_service:install_certificates"
        kind: "dangerous"

      - id: certificates_remove
        title: "Revoke"
        title_ru: "Отозвать"
        description: "Take that trust back."
        description_ru: "Забрать это доверие обратно."
        tooltip: "Removes those two certificates from your account and nothing else - the fingerprints are fixed in the program, so a certificate from another source stays where it is. State sites will warn again afterwards, and the install command can be run again at any time."
        tooltip_ru: "Убирает из вашей учётной записи те два сертификата и больше ничего: отпечатки зафиксированы в программе, поэтому чужой сертификат останется на месте. После этого госсайты снова будут предупреждать, а установку можно повторить в любой момент."
        service: "system_core.services.browsers_portable_service:remove_certificates"
        kind: "dangerous"

  - id: service_procedures
    title: "Service"
    title_ru: "Обслуживание"
    description: "What every build depends on."
    description_ru: "То, от чего зависит любая сборка."
    tooltip: "The unpacking tool; Chrome++ is refreshed with every build and update."
    tooltip_ru: "Распаковщик; Chrome++ обновляется вместе с каждой сборкой и обновлением."
    children:
      - id: install_7zip
        title: "7-Zip"
        title_ru: "7-Zip"
        description: "The unpacker every build needs."
        description_ru: "Распаковщик, без которого не собрать."
        tooltip: "Checks for `tools\\7zip\\bin\\7za.exe` and puts a portable copy into the project folder when it is missing. Without it there is nothing to unpack browser installers with, so no build can be made. Nothing is installed into Windows, and the project cleanup deletes this copy because it ages quickly."
        tooltip_ru: "Проверяет `tools\\7zip\\bin\\7za.exe` и, если его нет, кладёт портативную копию в папку проекта. Без него нечем распаковывать установщики браузеров, а значит, ни одна сборка не получится. В Windows ничего не устанавливается, а эта копия удаляется чисткой проекта, потому что быстро устаревает."
        service: "system_core.services.browsers_portable_service:install_portable_7zip"
        kind: "safe"

      - id: defender_exclusion_remove
        title: "Defender: remove exclusion"
        title_ru: "Defender: убрать исключение"
        description: "Take back the temporary build exclusion."
        description_ru: "Забрать временное исключение сборки."
        tooltip: "A build normally excludes its output folder from Windows Defender only while it runs and removes the exclusion the moment it finishes; an update excludes the input folder as well. This is the safety net for the rare case where a run was killed hard and an exclusion was left behind: it removes exactly the output and input exclusions. Windows asks for UAC. It reads nothing else and changes no other Defender setting; removing an exclusion that is not there is not an error."
        tooltip_ru: "Сборка обычно исключает свою папку output из Windows Defender только на время работы и снимает исключение сразу после; обновление исключает ещё и папку input. Это подстраховка на редкий случай, когда прогон убили жёстко и исключение осталось: снимаются ровно исключения output и input. Windows спросит UAC. Больше ничего не читается и никакие другие настройки Defender не трогаются; снять исключение, которого нет, - не ошибка."
        service: "system_core.services.browsers_portable_service:defender_exclusion_remove"
        kind: "dangerous"

maintenance_operations:
  - id: cleanup_input_output
    title: "Clear I/O"
    title_ru: "Очистить I/O"
    description: "Empty the input and output folders."
    description_ru: "Очистить папки input и output."
    tooltip: "Deletes what lies inside the program's own input and output folders, keeping the folders themselves, and asks for confirmation first. Builds you have already copied elsewhere are not affected - only the working copies here."
    tooltip_ru: "Удаляет то, что лежит внутри собственных папок программы input и output, сами папки остаются; сначала спрашивает подтверждение. Сборок, которые вы уже скопировали в другое место, это не касается - только рабочих копий здесь."
    service: "system_core.services.sample_service:cleanup_input_output"
    kind: "dangerous"

  - id: cleanup_workspace
    title: "Clear workspace"
    title_ru: "Очистить workspace"
    description: "Throw away the working leftovers."
    description_ru: "Выбросить рабочие остатки."
    tooltip: "Deletes downloads and unpacked installers from the workspace folder after confirmation. Finished builds, settings and logs are not touched - this is the leftover working material, which is large and of no use once a build is published."
    tooltip_ru: "Удаляет из папки workspace загрузки и распакованные установщики, спросив подтверждение. Готовые сборки, настройки и журналы не трогает: это остатки рабочего материала, который занимает много места и не нужен после публикации сборки."
    service: "system_core.services.sample_service:cleanup_workspace"
    kind: "dangerous"
