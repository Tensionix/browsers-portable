tool:
  id: audion_browsers_portable
  name: "Audion Browsers Portable"
  category: "Browsers"
  version: "1.4.0"

paths:
  input: "input"
  output: "output"
  logs: "logs"
  report: "report"
  workspace: "workspace"
  config: "config"
  release: "release"

ui:
  title: "Audion Browsers Portable"
  host: "127.0.0.1"
  port: 8080
  native: false
  reload: false
  open_browser: false

x-browser-selection: &browser_selection
  id: browsers
  type: "checkboxes"
  group: "source"
  label: "Browsers"
  label_ru: "Браузеры"
  default: []
  min_selected: 1
  options_source: "system_core.services.browsers_portable_service:browser_options"
  cache_seconds: 3600
  hint: "Only browsers with no self-updating portable build."
  hint_ru: "Только браузеры без портативной сборки с автообновлением."
  tooltip: "A browser is here only when its vendor ships no portable build that updates itself. Vivaldi with its standalone install, Cent Browser with its portable SFX and Opera with its own autoupdate packages gain nothing from this program and are deliberately absent. Every browser here is unpacked from its installer, never installed, and keeps its profile next to the executable."
  tooltip_ru: "Браузер попадает сюда, только если у разработчика нет портативной сборки, которая обновляет сама себя. Vivaldi со своей standalone-установкой, Cent Browser с портативным SFX и Opera с собственными пакетами обновления ничего от этой программы не выигрывают, поэтому их здесь намеренно нет. Каждый браузер отсюда распаковывается из установщика, а не устанавливается, и держит профиль рядом с исполняемым файлом."

# The same choice where it only narrows: Check and Update recognise a build by
# its executable, so nothing has to be ticked for them to work.
x-browser-filter: &browser_filter
  <<: *browser_selection
  min_selected: 0
  hint: "Nothing ticked - every build in Source."
  hint_ru: "Ничего не отмечено - все сборки из «Источника»."
  tooltip: "Leave everything unticked and each build found in Source is taken, whatever browser it is: a build is recognised by its executable, so it does not have to be named first. Several builds can lie in Source at once, each in a folder of its own. Tick browsers to narrow that down - or to say which Chromium a build is, since Chromium-Gost and Ungoogled Chromium cannot be told apart by their files."
  tooltip_ru: "Оставьте всё неотмеченным - и будут взяты все сборки, найденные в «Источнике», какой бы браузер в них ни был: сборка узнаётся по исполняемому файлу, называть её заранее не нужно. В «Источнике» может лежать сразу несколько сборок, каждая в своей папке. Отметки сужают выбор - и подсказывают, какой именно Chromium лежит в папке: Chromium-Gost и Ungoogled Chromium по файлам не различить."


x-chrome-installer: &chrome_installer
  id: chrome_download_url
  type: "text"
  section: "advanced"
  group: "source"
  label: "Chrome installer URL"
  label_ru: "Ссылка установщика Chrome"
  default: ""
  hint: "Blank uses the official source."
  hint_ru: "Пусто — официальный источник."
  tooltip: "Optional HTTP(S) URL of a full standalone installer. A custom Chrome file is fetched afresh for every build/update; its version is read from the unpacked executable rather than the stable version API."
  tooltip_ru: "Необязательная HTTP(S)-ссылка на полный standalone-установщик. Chrome по своей ссылке скачивается заново при каждой сборке или обновлении; версия читается из распакованного файла, а не из API стабильного выпуска."

x-yandex-installer: &yandex_installer
  id: yandex_download_url
  type: "text"
  section: "advanced"
  group: "source"
  label: "Yandex installer URL"
  label_ru: "Ссылка установщика Yandex"
  default: ""
  hint: "Blank uses the official source."
  hint_ru: "Пусто — официальный источник."
  tooltip: "Optional HTTP(S) URL of the full Yandex installer. Redirects use the Windows user agent. A custom file is fetched afresh for every build/update."
  tooltip_ru: "Необязательная HTTP(S)-ссылка на полный установщик Yandex. Перенаправления обрабатываются с пользовательским агентом Windows. Файл по своей ссылке скачивается заново при каждой сборке или обновлении."

x-yandex-updater: &yandex_updater
  id: disable_yandex_updater
  type: "checkbox"
  group: "options"
  label: "Disable Yandex updater"
  label_ru: "Отключить обновлятор Yandex"
  default: true
  tooltip: "Only for Yandex: removes service_update.exe inside App. Update the browser through this program afterwards. Off keeps the updater in a newly assembled App; restoring a previously removed file requires a rebuild."
  tooltip_ru: "Только для Yandex: удаляет service_update.exe внутри App. Обновлять браузер после этого нужно через эту программу. Выключенная галка оставляет обновлятор в заново собранной App; для возврата ранее удалённого файла нужна пересборка."

operations:
  - id: browsers_build
    title: "Build"
    title_ru: "Собрать"
    description: "A folder you can run from anywhere."
    description_ru: "Папка, которую можно запускать откуда угодно."
    tooltip: "Each selected browser is downloaded together with the selected portable library, unpacked and published as a ready build in the Target folder. Nothing is installed into Windows and no administrator rights are needed: the installer is only unpacked, and the profile lives in Data next to the browser, so the whole folder can be copied to a flash drive and carried away. If a build of that browser is already in the Target folder, only the browser inside it is replaced - the profile and everything else stay. If one browser fails the rest still finish, and the failures are listed at the end."
    tooltip_ru: "Каждый выбранный браузер скачивается вместе с выбранной библиотекой портативности, распаковывается и публикуется готовой сборкой в папке назначения. В Windows ничего не устанавливается и права администратора не нужны: установщик только распаковывается, а профиль лежит в папке Data рядом с браузером, поэтому всю папку можно скопировать на флешку и унести с собой. Если сборка этого браузера уже лежит в папке назначения, в ней заменяется только браузер - профиль и всё остальное остаются. Если один браузер не вышел, остальные всё равно соберутся, а неудачи перечисляются в конце."
    service: "system_core.services.browsers_portable_service:build_selected"
    kind: "safe"

  - id: browsers_update
    title: "Update"
    title_ru: "Обновить"
    description: "Fresh version, your profile untouched."
    description_ru: "Свежая версия, ваш профиль на месте."
    tooltip: "Only the browser itself is replaced, right inside the build the Source points at - the flash drive, the network share, wherever it lies. Data and Cache are left alone, so bookmarks, passwords and extensions survive the update. A build that already carries the published version is skipped without downloading anything."
    tooltip_ru: "Меняется только сам браузер, прямо внутри сборки, на которую указывает «Источник», - на флешке, в сетевой папке, где угодно. Data и Cache не трогаются, поэтому закладки, пароли и расширения переживают обновление. Сборка, которая уже несёт опубликованную версию, пропускается без скачивания."
    service: "system_core.services.browsers_portable_service:update_selected"
    kind: "safe"

  - id: browsers_check
    title: "Check"
    title_ru: "Проверить"
    description: "What is published, and what you already have."
    description_ru: "Что вышло и что уже стоит."
    tooltip: "For each selected browser it shows the version the vendor publishes today next to the version of the build on disk, so you can see whether an update is worth running at all. It reads release pages and version APIs only, and downloads nothing - the check costs a few small requests."
    tooltip_ru: "По каждому выбранному браузеру показывает версию, которую разработчик выложил сегодня, рядом с версией сборки на диске - видно, стоит ли вообще запускать обновление. Читает только страницы выпусков и API версий, ничего не скачивает: проверка стоит нескольких небольших запросов."
    service: "system_core.services.browsers_portable_service:check_updates"
    kind: "safe"


  - &browsers_library_update
    id: browsers_library_update
    title: "Update DLL only"
    title_ru: "Обновить только DLL"
    description: "Refresh the library in an existing build."
    description_ru: "Обновить библиотеку в готовой сборке."
    tooltip: "Select browsers and a library, then point Source at a build or its parent. Library files are updated in place; browser files, Data and Cache are kept. The same library keeps the existing INI; switching libraries creates the standard INI. A verified cached library is used if its source is unavailable."
    tooltip_ru: "Выберите браузеры и библиотеку, а в «Источнике» укажите сборку или папку со сборками. На месте обновляются файлы библиотеки; браузер, Data и Cache сохраняются. Для той же библиотеки остаётся прежний INI; при смене создаётся стандартный. При недоступности источника используется проверенный архив выбранной библиотеки."
    service: "system_core.services.browsers_portable_service:update_libraries_selected"
    kind: "safe"
    fields:
      - <<: *browser_selection
      - id: portable_engine
        type: "radio"
        group: "format"
        label: "Library"
        label_ru: "Библиотека"
        default: "proxy_library"
        options:
          - value: "proxy_library"
            label: "Proxy library"
            label_ru: "Прокси библиотека"
          - value: "chrome_plus"
            label: "Chrome++ (DeftKing)"
            label_ru: "Chrome++ (DeftKing)"
          - value: "vivaldi_plus"
            label: "Vivaldi++"
      - id: chrome_plus_arch
        type: "radio"
        group: "format"
        label: "Library architecture"
        label_ru: "Разрядность библиотеки"
        default: "auto"
        tooltip: "Auto reads each browser executable. An architecture mismatch is refused before changing any library file."
        tooltip_ru: "«Авто» читает разрядность из каждого браузера. Несовпадение отклоняется до изменения файлов библиотеки."
        options:
          - value: "auto"
            label: "Auto"
            label_ru: "Авто"
          - value: "x64"
            label: "x64"
          - value: "x86"
            label: "x86"
          - value: "arm64"
            label: "ARM64"
      - id: guard_defender
        type: "checkbox"
        group: "options"
        label: "Work around Defender during update"
        label_ru: "Обойти Defender на время обновления"
        default: true
        tooltip: "Temporarily excludes the workspace and the actual build folder, then removes the exclusion. No action when Defender is inactive."
        tooltip_ru: "На время замены DLL исключает рабочую папку и саму сборку, затем снимает исключение. При выключенном Defender ничего не делает."
      - id: keep_temp
        type: "checkbox"
        section: "advanced"
        group: "run"
        label: "Keep working files"
        label_ru: "Оставить рабочие файлы"
        default: false

  - &ready_portable_download
    id: ready_portable_download
    title: "Download"
    title_ru: "Скачать"
    description: "Official portable packages and installers."
    description_ru: "Официальные портативки и установщики."
    tooltip: "Downloads the official Cent Browser portable SFX, LibreWolf portable ZIP, Vivaldi installer, or regular DuckDuckGo Windows installer into Browser Downloads in the Target folder. For Vivaldi, open the saved installer and choose Advanced -> Install Standalone. Files keep their original contents and names."
    tooltip_ru: "Скачивает официальный портативный SFX Cent Browser, портативный ZIP LibreWolf, установщик Vivaldi или обычный установщик DuckDuckGo для Windows в Browser Downloads внутри папки назначения. Для Vivaldi откройте сохранённый установщик и выберите Дополнительно -> Установить автономную версию. Содержимое и названия файлов сохраняются."
    service: "system_core.services.ready_portable_service:download_selected"
    kind: "safe"
    fields:
      - id: ready_browsers
        type: "checkboxes"
        group: "source"
        label: "Browsers"
        label_ru: "Браузеры"
        default: []
        min_selected: 1
        options_source: "system_core.services.ready_portable_service:browser_options"
        hint: "Official files, without DLL replacement."
        hint_ru: "Официальные файлы, без подмены DLL."
        tooltip: "Cent Browser: portable self-extracting package. LibreWolf: portable ZIP. Vivaldi: installer with Install Standalone. DuckDuckGo: regular Windows installer. The command only saves files for you to open or unpack yourself."
        tooltip_ru: "Cent Browser: портативный самораспаковывающийся пакет. LibreWolf: портативный ZIP. Vivaldi: установщик с режимом Standalone. DuckDuckGo: обычный установщик для Windows. Команда только сохраняет файлы для самостоятельного запуска или распаковки."
      - id: ready_arch
        type: "radio"
        group: "format"
        label: "Architecture"
        label_ru: "Разрядность"
        default: "x64"
        tooltip: "Cent: x86/x64. LibreWolf: x64/ARM64. Vivaldi: x86/x64/ARM64. DuckDuckGo: x64. An unsupported choice is reported for that browser while the remaining downloads continue."
        tooltip_ru: "Cent: x86/x64. LibreWolf: x64/ARM64. Vivaldi: x86/x64/ARM64. DuckDuckGo: x64. Если разрядность недоступна для одного браузера, остальные файлы всё равно скачиваются."
        options:
          - value: "x64"
            label: "x64"
            label_ru: "x64"
          - value: "x86"
            label: "x86"
            label_ru: "x86"
          - value: "arm64"
            label: "ARM64"
            label_ru: "ARM64"


  - &certificates_stage
    id: certificates_stage
    title: "Add to build"
    title_ru: "Добавить в сборку"
    description: "Save certificate files in an existing build."
    description_ru: "Сохранить файлы сертификатов в готовой сборке."
    tooltip: "Saves the two Russian Trusted CA certificates and install/revoke commands under Certificates in the selected builds. It does not install certificates into Windows or change the browser and profile."
    tooltip_ru: "Сохраняет два сертификата НУЦ Минцифры и команды установки и отзыва в Certificates выбранных сборок. Сертификаты в Windows не устанавливаются, браузер и профиль не меняются."
    service: "system_core.services.browsers_portable_service:stage_certificates_selected"
    kind: "safe"
    fields:
      - <<: *browser_selection
        id: certificate_browsers
        default: ["chrome"]

  - id: certificates_state
    title: "Certificates: check"
    title_ru: "Сертификаты: проверить"
    description: "Does this computer trust state sites."
    description_ru: "Доверяет ли компьютер госсайтам."
    tooltip: "Russian state sites are signed by the Ministry of Digital Development authority, which Windows does not trust out of the box - such a site opens with a security warning. This reports whether the two certificates are already in place for your account, looking them up by fingerprint. It reads the certificate stores and changes nothing."
    tooltip_ru: "Российские госсайты подписаны удостоверяющим центром Минцифры, которому Windows по умолчанию не доверяет, - такой сайт открывается с предупреждением о безопасности. Здесь видно, стоят ли уже оба сертификата у вашей учётной записи: они ищутся по отпечатку. Только читает хранилища сертификатов, ничего не меняет."
    service: "system_core.services.browsers_portable_service:certificates_state"
    kind: "safe"

  - id: certificates_install
    title: "Certificates: install"
    title_ru: "Сертификаты: установить"
    description: "Open state sites without a warning."
    description_ru: "Открывать госсайты без предупреждения."
    tooltip: "Adds the two Russian Trusted CA certificates - the root one and the one under it - to your own account in Windows, not to the whole machine. No administrator rights are needed and other accounts stay as they were. The trust is account-wide rather than per browser: every Chromium browser here, portable or installed, stops warning about state sites afterwards. `Certificates: revoke` puts everything back."
    tooltip_ru: "Добавляет два сертификата НУЦ Минцифры - корневой и подчинённый - вашей учётной записи Windows, а не всему компьютеру. Права администратора не нужны, другие учётные записи остаются как были. Доверие ставится на учётную запись, а не на отдельный браузер: после этого все браузеры на Chromium - и портативные, и установленные - перестают предупреждать о госсайтах. «Сертификаты: отозвать» возвращает всё назад."
    service: "system_core.services.browsers_portable_service:install_certificates"
    kind: "dangerous"

  - id: certificates_remove
    title: "Certificates: revoke"
    title_ru: "Сертификаты: отозвать"
    description: "Take that trust back."
    description_ru: "Забрать это доверие обратно."
    tooltip: "Removes exactly the two certificates this program installs and nothing else: they are found by their fingerprint, which is fixed in the program, so a certificate someone else put there stays where it is. State sites will warn again afterwards, and the install command can be run any time."
    tooltip_ru: "Удаляет ровно те два сертификата, которые ставит эта программа, и больше ничего: они ищутся по отпечатку, зашитому в программу, поэтому чужой сертификат останется на месте. После этого госсайты снова будут предупреждать, а установку можно повторить в любой момент."
    service: "system_core.services.browsers_portable_service:remove_certificates"
    kind: "dangerous"

  - id: install_7zip
    title: "7-Zip"
    title_ru: "7-Zip"
    description: "The unpacker every build needs."
    description_ru: "Распаковщик, без которого не собрать."
    tooltip: "A browser is never installed here - its installer is unpacked instead, and that is what 7-Zip does. This checks for `tools\\7zip\\bin\\7za.exe` and, when it is missing, downloads a portable copy into the project folder. Nothing is installed into Windows, and the copy is deleted by the project cleanup because it ages quickly."
    tooltip_ru: "Браузер здесь не устанавливается - вместо этого распаковывается его установщик, и делает это 7-Zip. Проверяет `tools\\7zip\\bin\\7za.exe` и, если его нет, кладёт портативную копию в папку проекта. В Windows ничего не устанавливается, а копия удаляется чисткой проекта, потому что быстро устаревает."
    service: "system_core.services.browsers_portable_service:install_portable_7zip"
    kind: "safe"

  - id: defender_exclusion_remove
    title: "Defender: remove exclusion"
    title_ru: "Defender: убрать исключение"
    description: "Take back the temporary build exclusion."
    description_ru: "Забрать временное исключение сборки."
    tooltip: "A build normally excludes its output folder from Windows Defender only while it runs and removes the exclusion the moment it finishes; an update excludes the input folder as well. This is the safety net for the rare case where a run was killed hard and an exclusion was left behind: it removes exactly the output and input exclusions. Windows asks for UAC. It reads nothing else and changes no other Defender setting; removing an exclusion that is not there is not an error."
    tooltip_ru: "Сборка обычно исключает свою папку output из Windows Defender только на время работы и снимает исключение сразу после; обновление исключает ещё и папку input. Это подстраховка на редкий случай, когда прогон убили жёстко и исключение осталось: снимаются ровно исключения output и input. Windows спросит UAC. Больше ничего не читается и никакие другие настройки Defender не трогаются; снять исключение, которого нет, - не ошибка."
    service: "system_core.services.browsers_portable_service:defender_exclusion_remove"
    kind: "dangerous"

operation_groups:
  - id: install
    title: "Install"
    title_ru: "Установка"
    description: "A new build, taken from the Target folder."
    description_ru: "Новая сборка, забрать из папки назначения."
    tooltip: "Everything here builds a new portable browser: the installer is unpacked rather than run, so nothing reaches Windows and no administrator rights are needed. The finished folder appears in the Target folder, ready to be copied onto a flash drive or handed over as it is."
    tooltip_ru: "Здесь собирается новый портативный браузер: установщик распаковывается, а не запускается, поэтому в Windows ничего не попадает и права администратора не нужны. Готовая папка появляется в папке назначения - её можно скопировать на флешку или отдать как есть."
    children:
      - id: browsers_build
        title: "Build"
        title_ru: "Собрать"
        description: "A folder you can run from anywhere."
        description_ru: "Папка, которую можно запускать откуда угодно."
        tooltip: "Downloads each selected browser with its wrapper and publishes a ready build into the Target folder. If a build of that browser is already there, only the browser inside it is replaced - the profile and everything else stay. If one browser fails - a page moved, a download broke - the rest still finish, and the failures are listed at the end of the run."
        tooltip_ru: "Скачивает каждый выбранный браузер вместе с обёрткой и кладёт готовую сборку в папку назначения. Если сборка этого браузера там уже лежит, в ней заменяется только браузер - профиль и всё остальное остаются. Если один браузер не вышел - переехала страница, оборвалась загрузка, - остальные всё равно соберутся, а неудачи перечисляются в конце прогона."
        service: "system_core.services.browsers_portable_service:build_selected"
        kind: "safe"
        fields:
          - <<: *browser_selection

          - <<: *yandex_updater

          - id: stage_certificates
            type: "checkbox"
            group: "options"
            label: "State site certificates"
            label_ru: "Сертификаты госсайтов"
            default: false
            hint: "Files and two shortcuts, nothing more."
            hint_ru: "Файлы и два ярлыка, не более."
            tooltip: "Russian state sites are signed by the Ministry of Digital Development authority, which Windows does not trust out of the box, so such a site opens with a security warning. This puts the two certificate files into every build together with two shortcuts - install and revoke. The files alone change nothing: the warning goes away only after someone runs the install shortcut on that computer, and the revoke shortcut takes the trust back. Yandex Browser trusts these sites on its own and needs none of it."
            tooltip_ru: "Российские госсайты подписаны удостоверяющим центром Минцифры, которому Windows по умолчанию не доверяет, поэтому такой сайт открывается с предупреждением о безопасности. Здесь в каждую сборку кладутся два файла сертификатов и два ярлыка - установить и отозвать. Сами файлы ничего не меняют: предупреждение исчезнет только после того, как на том компьютере запустят ярлык установки, а ярлык отзыва вернёт всё обратно. Яндекс.Браузер доверяет таким сайтам сам, ему это не нужно."

          - id: portable_engine
            type: "radio"
            group: "format"
            label: "Portability"
            label_ru: "Портативность"
            default: "proxy_library"
            hint: "Which library sits beside the browser."
            hint_ru: "Какая библиотека лежит рядом с браузером."
            tooltip: "Proxy library is the default (x86/x64), with all optional INI switches set to 0. Chrome++ comes from DeftKing; Vivaldi++ comes from ca-x. Both alternatives support x86/x64/ARM64. If a source is unavailable, a verified local archive of the selected library is used."
            tooltip_ru: "По умолчанию используется прокси библиотека (x86/x64), все переключатели INI равны 0. Chrome++ загружается из DeftKing, Vivaldi++ — из ca-x; обе альтернативы поддерживают x86/x64/ARM64. При недоступности источника используется проверенный локальный архив выбранной библиотеки."
            options:
              - value: "proxy_library"
                label: "Proxy library"
                label_ru: "Прокси библиотека"
              - value: "chrome_plus"
                label: "Chrome++ (DeftKing)"
                label_ru: "Chrome++ (DeftKing)"
              - value: "vivaldi_plus"
                label: "Vivaldi++"
                label_ru: "Vivaldi++"

          - id: chrome_plus_arch
            type: "radio"
            group: "format"
            label: "Wrapper architecture"
            label_ru: "Разрядность обёртки"
            default: "auto"
            hint: "Auto reads it from the browser."
            hint_ru: "«Авто» читает из самого браузера."
            tooltip: "The library architecture must match the browser executable. Proxy library supports x86/x64; Chrome++ (DeftKing) and Vivaldi++ also support ARM64."
            tooltip_ru: "Разрядность библиотеки должна совпадать с исполняемым файлом браузера. Прокси библиотека поддерживает x86/x64; Chrome++ (DeftKing) и Vivaldi++ также поддерживают ARM64."
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
              - value: "x64"
                label: "x64"
                label_ru: "x64"
              - value: "x86"
                label: "x86"
                label_ru: "x86"
              - value: "arm64"
                label: "ARM64"
                label_ru: "ARM64"

          - id: wipe_registry_on_exit
            type: "checkbox"
            group: "options"
            label: "Clean registry with Chrome++"
            label_ru: "Очистить реестр с Chrome++"
            default: false
            hint: "Applies only to Chrome++ (DeftKing)."
            hint_ru: "Только для Chrome++ (DeftKing)."
            tooltip: "Chrome++ can wipe the browser registry branch on exit where the same browser is not installed. Proxy library switches remain 0; Vivaldi++ does not use this option."
            tooltip_ru: "Chrome++ может очистить ветку реестра браузера при выходе, если тот же браузер не установлен. Параметры прокси библиотеки остаются нулевыми; Vivaldi++ эту галку не использует."

          - id: guard_defender
            type: "checkbox"
            group: "options"
            label: "Work around Defender while building"
            label_ru: "Обойти Defender на время сборки"
            default: true
            hint: "Only when Defender is running."
            hint_ru: "Только когда Defender включён."
            tooltip: "Chrome++'s version.dll is a routine Windows Defender false positive: real-time protection can grab it mid-build, and packaging then dies with an unhelpful error. With this on, the output folder is excluded from Defender only for the length of the build and put back the moment it finishes - Windows asks for UAC once, and the exclusion is removed even if the build fails. It is a no-op where Defender is not running, so it never asks for anything on such machines. This changes nothing for whoever receives the build: their Defender may still flag version.dll, which is fixed by submitting it to Microsoft as a false positive."
            tooltip_ru: "version.dll от Chrome++ - обычное ложное срабатывание Windows Defender: защита в реальном времени может забрать файл посреди сборки, и тогда упаковка падает с невнятной ошибкой. С этой галкой папка output исключается из Defender только на время сборки и возвращается сразу после - Windows один раз спросит UAC, а исключение снимается даже если сборка не удалась. Там, где Defender не запущен, галка ничего не делает и ничего не спрашивает. На получателя сборки это не влияет: у него Defender всё ещё может ругаться на version.dll - это лечится отправкой файла в Microsoft как ложного срабатывания."

          - id: package_archive
            type: "checkbox"
            group: "output"
            label: "Pack into an archive"
            label_ru: "Упаковать в архив"
            default: false
            hint: "One file instead of a folder."
            hint_ru: "Один файл вместо папки."
            tooltip: "Off publishes ready-to-run folders: open the folder and start the browser. On packs each browser into its own archive - a single file, easier to put on a flash drive, upload or send to a colleague, who unpacks it and runs it exactly the same way. The archive lands in the Target folder next to the folders."
            tooltip_ru: "Выключено - публикуются готовые папки: открыл папку и запустил браузер. Включено - каждый браузер пакуется в свой архив: один файл, его проще положить на флешку, выложить или отправить коллеге, а тот распакует и запустит точно так же. Архив ложится в папку назначения рядом с папками."

          - id: archive_format
            type: "radio"
            group: "output"
            label: "Archive format"
            label_ru: "Формат архива"
            default: "zip"
            hint: "ZIP anywhere, 7Z smaller."
            hint_ru: "ZIP везде, 7Z меньше."
            tooltip: "ZIP opens on any Windows computer with no extra program at all, which matters when the build goes to someone else. 7Z packs a browser noticeably smaller - useful for a slow upload - but whoever receives it has to have 7-Zip installed."
            tooltip_ru: "ZIP открывается на любом компьютере с Windows вообще без лишних программ - это важно, когда сборка уезжает к другому человеку. 7Z ужимает браузер заметно сильнее, что полезно при медленной выгрузке, но у получателя должен быть установлен 7-Zip."
            options:
              - value: "zip"
                label: "ZIP"
                label_ru: "ZIP"
              - value: "7z"
                label: "7Z"
                label_ru: "7Z"

          - <<: *chrome_installer
          - <<: *yandex_installer

          - id: keep_temp
            type: "checkbox"
            section: "advanced"
            group: "run"
            label: "Keep working files"
            label_ru: "Оставить рабочие файлы"
            default: false
            hint: "For finding out what went wrong."
            hint_ru: "Чтобы разобраться, что пошло не так."
            tooltip: "Downloads and unpacked installers normally disappear from the workspace folder as soon as the build is published, because they are large. Keep them when a build failed and the reason has to be found: the half-finished result is then still on disk and can be looked at."
            tooltip_ru: "Загрузки и распакованные установщики обычно исчезают из папки workspace сразу после публикации сборки - они большие. Оставьте их, если сборка не удалась и нужно понять причину: тогда недоделанный результат останется на диске, и его можно будет посмотреть."


  - id: browser_downloads
    title: "Downloads"
    title_ru: "Скачивание"
    description: "Download the vendor's original files."
    description_ru: "Скачать оригинальные файлы разработчиков."
    tooltip: "Cent Browser and LibreWolf portable packages, Vivaldi's Standalone installer, and a regular DuckDuckGo installer. Only the original files are downloaded."
    tooltip_ru: "Портативные пакеты Cent Browser и LibreWolf, установщик Vivaldi с режимом Standalone и обычный установщик DuckDuckGo. Скачиваются только оригинальные файлы."
    children:
      - <<: *ready_portable_download

  - id: update
    title: "Update"
    title_ru: "Обновление"
    description: "Update the build in place."
    description_ru: "Обновить сборку на её месте."
    tooltip: "Point Source at the folder with the build - a flash drive, a network share, wherever it lives - and it is updated right there, not copied into the Target folder. Only the browser is replaced; the profile with bookmarks, passwords and extensions stays untouched."
    tooltip_ru: "Укажите в «Источнике» папку со сборкой - на флешке, в сетевой папке, где угодно, - и она обновится прямо там, а не скопируется в папку назначения. Меняется только браузер, профиль с закладками, паролями и расширениями остаётся нетронутым."
    children:
      - id: browsers_check
        title: "Check"
        title_ru: "Проверить"
        description: "Is there anything to update."
        description_ru: "Есть ли что обновлять."
        tooltip: "Compares the version published today with the one in the build and downloads nothing. It looks at the folder in Source first, then in output\\Portable, so a build being carried around is checked before the local ones."
        tooltip_ru: "Сравнивает версию, выложенную сегодня, с версией сборки и ничего не скачивает. Смотрит сначала в папку из «Источника», затем в output\\Portable, - сборка, которую носят с собой, проверяется раньше локальных."
        service: "system_core.services.browsers_portable_service:check_updates"
        kind: "safe"
        # Its button stands to the left of Update's and reads that panel's fields.
        beside: browsers_update
        fields:
          - <<: *browser_filter

          - id: portable_engine
            type: "radio"
            group: "format"
            label: "Portability"
            label_ru: "Портативность"
            default: "proxy_library"
            hint: "Which wrapper to compare against."
            hint_ru: "С какой обёрткой сверять."
            tooltip: "Proxy library is the default (x86/x64), with all optional INI switches set to 0. Chrome++ comes from DeftKing; Vivaldi++ comes from ca-x. Both alternatives support x86/x64/ARM64. If a source is unavailable, a verified local archive of the selected library is used."
            tooltip_ru: "По умолчанию используется прокси библиотека (x86/x64), все переключатели INI равны 0. Chrome++ загружается из DeftKing, Vivaldi++ — из ca-x; обе альтернативы поддерживают x86/x64/ARM64. При недоступности источника используется проверенный локальный архив выбранной библиотеки."
            options:
              - value: "proxy_library"
                label: "Proxy library"
                label_ru: "Прокси библиотека"
              - value: "chrome_plus"
                label: "Chrome++ (DeftKing)"
                label_ru: "Chrome++ (DeftKing)"
              - value: "vivaldi_plus"
                label: "Vivaldi++"
                label_ru: "Vivaldi++"

          - <<: *chrome_installer
          - <<: *yandex_installer

      - id: browsers_update
        title: "Update"
        title_ru: "Обновить"
        description: "Fresh version, your profile untouched."
        description_ru: "Свежая версия, ваш профиль на месте."
        tooltip: "Replaces the browser inside the build and leaves the profile alone, so bookmarks, passwords and extensions stay. A build that already carries the published version, with a current wrapper, is skipped without downloading anything - use `Rebuild without a new version` when it has to be replaced regardless. A portable browser made elsewhere can be put into Source as it is: it is found by its executable, updated, and brought to this program's layout - App, Data, Cache - with the profile kept. Nothing that lay beside the browser is deleted: your own files stay where they were, and another packer's launchers go into `Old files` inside the build."
        tooltip_ru: "Меняет в сборке браузер, не трогая профиль: закладки, пароли и расширения остаются. Сборка со свежей версией и актуальной обёрткой пропускается без скачивания - если её всё равно нужно заменить, включите «Пересобрать без новой версии». Портативный браузер, собранный не здесь, можно положить в «Источник» как есть: он находится по исполняемому файлу, обновляется и приводится к виду этой программы - App, Data, Cache, - а профиль сохраняется. Ничего из лежавшего рядом с браузером не удаляется: ваши файлы остаются на месте, а файлы запуска другого упаковщика переносятся в папку `Old files` внутри сборки."
        service: "system_core.services.browsers_portable_service:update_selected"
        kind: "safe"
        fields:
          - <<: *browser_filter

          - id: force_update
            type: "checkbox"
            group: "run"
            label: "Rebuild without a new version"
            label_ru: "Пересобрать без новой версии"
            default: false
            hint: "For a damaged build."
            hint_ru: "Для повреждённой сборки."
            tooltip: "Normally a build that already carries the published version is skipped and nothing is downloaded. Turn this on for a build whose browser is damaged or was assembled elsewhere: it is then downloaded and replaced regardless of the version. The profile stays untouched either way, so bookmarks and passwords survive the rebuild."
            tooltip_ru: "Обычно сборка с уже опубликованной версией пропускается и ничего не скачивается. Включите для сборки, у которой браузер повреждён или собран не здесь: тогда он будет скачан и заменён независимо от версии. Профиль в любом случае остаётся нетронутым, так что закладки и пароли переживут пересборку."

          - <<: *yandex_updater

          - id: stage_certificates
