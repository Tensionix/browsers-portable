            hint_ru: "Оставить их в сборке."
            tooltip: "Keeps the two certificate files and their install and revoke shortcuts in the updated build. Off removes them from the build instead. Neither choice touches the browser or the profile, and neither changes what this computer already trusts - that is done by the shortcuts, or by the Certificate section."
            tooltip_ru: "Оставляет в обновлённой сборке два файла сертификатов и ярлыки установки и отзыва. Выключено - убирает их из сборки. Ни то, ни другое не трогает браузер и профиль и не меняет то, чему уже доверяет этот компьютер: этим занимаются ярлыки или раздел «Сертификат»."

          - id: portable_engine
            type: "radio"
            group: "format"
            label: "Portability"
            label_ru: "Портативность"
            default: "proxy_library"
            hint: "Which library sits beside the browser."
            hint_ru: "Какая библиотека лежит рядом с браузером."
            tooltip: "Proxy library is the default (x86/x64), with all optional INI switches set to 0. Chrome++ comes from DeftKing; Vivaldi++ comes from ca-x. Both alternatives support x86/x64/ARM64. If a source is unavailable, a verified local archive of the selected library is used."
            tooltip_ru: "По умолчанию используется прокси библиотека (x86/x64), все переключатели INI равны 0. Chrome++ загружается из DeftKing, Vivaldi++ — из ca-x; обе альтернативы поддерживают x86/x64/ARM64. При недоступности источника используется проверенный локальный архив выбранной библиотеки."
            options:
              - value: "proxy_library"
                label: "Proxy library"
                label_ru: "Прокси библиотека"
              - value: "chrome_plus"
                label: "Chrome++ (DeftKing)"
                label_ru: "Chrome++ (DeftKing)"
              - value: "vivaldi_plus"
                label: "Vivaldi++"
                label_ru: "Vivaldi++"

          - id: chrome_plus_arch
            type: "radio"
            group: "format"
            label: "Wrapper architecture"
            label_ru: "Разрядность обёртки"
            default: "auto"
            hint: "Auto reads it from the browser."
            hint_ru: "«Авто» читает из самого браузера."
            tooltip: "The library architecture must match the browser executable. Proxy library supports x86/x64; Chrome++ (DeftKing) and Vivaldi++ also support ARM64."
            tooltip_ru: "Разрядность библиотеки должна совпадать с исполняемым файлом браузера. Прокси библиотека поддерживает x86/x64; Chrome++ (DeftKing) и Vivaldi++ также поддерживают ARM64."
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
              - value: "x64"
                label: "x64"
                label_ru: "x64"
              - value: "x86"
                label: "x86"
                label_ru: "x86"
              - value: "arm64"
                label: "ARM64"
                label_ru: "ARM64"

          - id: wipe_registry_on_exit
            type: "checkbox"
            group: "options"
            label: "Clean registry with Chrome++"
            label_ru: "Очистить реестр с Chrome++"
            default: false
            hint: "Applies only to Chrome++ (DeftKing)."
            hint_ru: "Только для Chrome++ (DeftKing)."
            tooltip: "Chrome++ can wipe the browser registry branch on exit where the same browser is not installed. Proxy library switches remain 0; Vivaldi++ does not use this option."
            tooltip_ru: "Chrome++ может очистить ветку реестра браузера при выходе, если тот же браузер не установлен. Параметры прокси библиотеки остаются нулевыми; Vivaldi++ эту галку не использует."

          - id: guard_defender
            type: "checkbox"
            group: "options"
            label: "Work around Defender while updating"
            label_ru: "Обойти Defender на время обновления"
            default: true
            hint: "Only when Defender is running."
            hint_ru: "Только когда Defender включён."
            tooltip: "Chrome++'s version.dll is a routine Windows Defender false positive: real-time protection can grab it mid-update - both in the workspace and inside the builds being updated - and the step then dies with an unhelpful error. With this on, the output and input folders are excluded from Defender only for the length of the update and put back the moment it finishes; Windows asks for UAC once, and the exclusion is removed even if the update fails. It is a no-op where Defender is not running."
            tooltip_ru: "version.dll от Chrome++ - обычное ложное срабатывание Windows Defender: защита в реальном времени может забрать файл посреди обновления - и во временной папке, и внутри обновляемых сборок, - и тогда шаг падает с невнятной ошибкой. С этой галкой папки output и input исключаются из Defender только на время обновления и возвращаются сразу после; Windows один раз спросит UAC, а исключение снимается даже если обновление не удалось. Там, где Defender не запущен, галка ничего не делает."

          - id: package_archive
            type: "checkbox"
            group: "output"
            label: "Pack into an archive"
            label_ru: "Упаковать в архив"
            default: false
            hint: "Plus an archive in the Target folder."
            hint_ru: "Плюс архив в папке назначения."
            tooltip: "The updated build is packed into an archive as well and put into the Target folder, ready to hand over. The build itself stays where it was and remains ready to run - the archive is a copy, not a move. The archive is named after the build's folder, so several builds of one browser give an archive each."
            tooltip_ru: "Обновлённая сборка дополнительно пакуется в архив и кладётся в папку назначения - можно сразу отдавать. Сама сборка остаётся там же, где была, и по-прежнему готова к запуску: архив - это копия, а не перенос. Архив называется по папке сборки, поэтому у нескольких сборок одного браузера у каждой свой архив."

