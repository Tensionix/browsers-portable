<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title description">
  <title id="title">Audion Browsers Portable</title>
  <desc id="description">A Chromium-inspired blue circular browser emblem with a white download arrow. The emblem fills the square canvas; the surrounding corners are transparent.</desc>
  <g id="chromium-emblem">
    <circle id="medium-blue-sector-base" cx="512" cy="512" r="512" fill="#2f91fd"/>
    <path id="dark-blue-sector" fill="#0a62d7"
          d="M 68.594993 256
             A 512 512 0 0 1 955.405007 256
             H 512
             L 290.297497 640
             Z"/>
    <path id="light-blue-sector" fill="#70b1fd"
          d="M 955.405007 256
             A 512 512 0 0 1 512 1024
             L 733.702503 640
             L 512 256
             Z"/>
    <circle id="white-center-ring" cx="512" cy="512" r="256" fill="#ffffff"/>
    <circle id="blue-center" cx="512" cy="512" r="217" fill="#1a78ea"/>
  </g>
  <path id="download-arrow" fill="#ffffff"
        d="M 460 368
           H 564
           C 573 368 580 375 580 384
           V 520
           H 648
           C 661 520 667 535 658 544
           L 526 676
           C 518 684 506 684 498 676
           L 366 544
           C 357 535 363 520 376 520
           H 444
           V 384
           C 444 375 451 368 460 368
           Z"/>
</svg>
