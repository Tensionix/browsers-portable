    <path id="left-blue-module" d="M 46.732829 725.706479 A 512 512 0 0 1 464.441655 2.213570 A 20 20 0 0 1 486.271993 21.080384 L 495.704765 201.068391 A 20 20 0 0 1 478.057035 221.979526 A 292 292 0 0 0 243.863420 627.614767 A 20 20 0 0 1 234.577710 653.353717 L 73.987138 735.178701 A 20 20 0 0 1 46.732829 725.706479 Z" fill="url(#blue)"/>
