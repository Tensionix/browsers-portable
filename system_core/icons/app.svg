<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Audion Browsers Portable</title>
  <desc id="description">Three independent rounded annular modules in blue and Burnt Orange surround a graphite download hub. Transparent radial seams and a circular gap separate the modules and the center. The corners outside the circular emblem are transparent.</desc>
  <defs>
    <linearGradient id="blue" x1="64" y1="128" x2="980" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65E6FF"/>
      <stop offset=".5" stop-color="#18B6EE"/>
      <stop offset="1" stop-color="#147BE8"/>
    </linearGradient>
    <linearGradient id="burnt" x1="224" y1="728" x2="800" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EE894A"/>
      <stop offset=".5" stop-color="#CC5500"/>
      <stop offset="1" stop-color="#A63B19"/>
    </linearGradient>
    <linearGradient id="hub" x1="300" y1="300" x2="724" y2="748" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26334C"/>
      <stop offset=".5" stop-color="#151D31"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
  </defs>
